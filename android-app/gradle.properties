# Gradle settings for the Android packaging step.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# The Rust side is built by Gradle; keep the two caches apart so
# `./gradlew clean` never throws away Rust's incremental build.
android.useAndroidX=true
android.nonTransitiveRClass=true

# Override with -PandroidAbi=arm64-v8a to build a single ABI.
androidAbi=arm64-v8a,armeabi-v7a,x86_64,x86
