[workspace]
resolver = "2"
members = [
    "crates/shared",
    "crates/ui",
    "crates/resources",
    "crates/build-config",
    "crates/platform/linux",
    "crates/platform/android",
    "crates/platform/ios",
    "crates/platform/windows",
    "crates/platform/macos",
    "crates/platform/web",
    "apps/example",
    "apps/server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Rustinaz/code-template"
homepage = "https://sina-khanzadeh.ir"
authors = ["Sina Khanzadeh <khanzadeh.1377@gmail.com>"]
description = "Rustinaz - a Rust-first cross-platform app template (Linux, Windows, macOS, Android, iOS, web)"

[workspace.dependencies]
# Core dependencies
tokio = { version = "1.40", features = ["full", "tracing"] }
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
once_cell = "1.19"
parking_lot = "0.12"
async-trait = "0.1"
futures = "0.3"
# Pure Rust, so these cross-compile to every target in this workspace without
# pulling in a C toolchain. Used for password hashing and salt generation.
argon2 = "0.5"
password-hash = { version = "0.5", features = ["rand_core"] }
rand = "0.8"

# Serialization
toml = "0.8"
ron = "0.8"

# UI dependencies
egui = { version = "0.29", features = ["accesskit", "persistence"] }
eframe = { version = "0.29", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
    # Android/iOS backends. `android-native-activity` makes winit build the
    # `native-activity` glue, which is what the APK in `android-app/` loads.
    "android-native-activity",
] }
winit = { version = "0.30", default-features = false, features = [
    "rwh_06",
    "android-native-activity",
    "x11",
    "wayland",
] }

# Build & Config
clap = { version = "4.3", features = ["derive", "env"] }
config = { version = "0.14", features = ["toml"] }
directories = "5.0"
semver = "1.0"

# Testing
pretty_assertions = "1.4"

# Platform-specific
android-activity = { version = "0.6.1", features = ["native-activity"] }
# Must match the `jni` that `android-activity` 0.6 resolves to. Two versions in
# the graph means two incompatible `JNIEnv` types, which does not compile.
jni = "0.22"
# The browser bindings. `js-sys` is here because `web-sys` re-exports through
# it; nothing in this workspace uses it directly yet, but `js_sys::Function`
# appears in the web DOM bindings.
wasm-bindgen = "0.2"
js-sys = "0.3"
# Every entry here is a feature that unlocks a *method*, not just a type.
# `web-sys` generates a method only when its feature is on, so a missing entry
# shows up as "no method named `class_list` / `style` / `head`" rather than as a
# missing import. Each one is required by `crates/ui/src/platform/web.rs`.
web-sys = { version = "0.3", features = [
    "AddEventListenerOptions",
    "CssStyleDeclaration",
    "Document",
    "DomTokenList",
    "Element",
    "Event",
    "EventListenerOptions",
    "EventTarget",
    "HtmlCollection",
    "HtmlElement",
    "HtmlHeadElement",
    "Node",
    "Text",
    "Window",
] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
] }

# Utilities
uuid = { version = "1.8", features = ["v4", "serde", "fast-rng"] }
chrono = { version = "0.4", features = ["serde"] }
# A drop-in `std::time` that does not abort on `wasm32-unknown-unknown`, where
# `Instant::now()` and `SystemTime::now()` are unsupported. On every other
# target it is a plain `pub use std::time`, so it costs nothing off the web.
web-time = "1.1"
url = "2.5"
regex = "1.10"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
opener = "0.7"

[workspace.lints]
rust.unused = "warn"
clippy = { all = "warn", pedantic = "warn", nursery = "warn", cargo = "warn" }
rustdoc = { all = "warn" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
# `panic = "abort"` is deliberately NOT set: it would make `cargo test --release`
# unusable, and a template that cannot be tested in release mode is a trap.

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 2
debug = true